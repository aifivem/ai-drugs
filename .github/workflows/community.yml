# Issues and pull requests are mirrored to the Discord forums: see aifivem/.github.
name: community

on:
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  community:
    uses: aifivem/.github/.github/workflows/community.yml@main
    # Only the two forum webhooks: never every secret on a pull_request_target run.
    secrets:
      DISCORD_BUG_FORUM_WEBHOOK: ${{ secrets.DISCORD_BUG_FORUM_WEBHOOK }}
      DISCORD_SUGGESTION_FORUM_WEBHOOK: ${{ secrets.DISCORD_SUGGESTION_FORUM_WEBHOOK }}
